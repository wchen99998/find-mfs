[package]
name = "find-mfs-rust"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
good_lp = { version = "1.15.1", default-features = false, features = ["highs"] }
grb = { version = "3.0.1", default-features = false, features = ["gurobi12"], optional = true }
libloading = "0.8"
pyo3 = { version = "0.22.6", optional = true }
rayon = "1.10"

[features]
default = ["extension-module"]
extension-module = ["dep:pyo3", "pyo3/extension-module"]
gurobi = ["dep:grb"]

[profile.release]
lto = true
codegen-units = 1
